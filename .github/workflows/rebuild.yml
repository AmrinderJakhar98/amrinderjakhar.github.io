name: Rebuild site

# Runs when publications.csv or build.py changes (for example after you add a
# paper on github.com). Fills missing paper details from Crossref, regenerates
# the HTML pages and commits them, then GitHub Pages publishes the result.
on:
  push:
    branches: [main]
    paths: ["publications.csv", "build.py", "assets/Amrinder_Jakhar_CV.pdf", ".github/workflows/rebuild.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build pages
        run: python build.py .
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml robots.txt CNAME .nojekyll publications.csv
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Rebuild pages from publications.csv"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
